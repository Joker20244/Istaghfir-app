name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create --org com.jkworks --project-name istaghfar temp_project

      - name: Debug - Show Android Files
        run: |
          echo "=== Files in android/app/ ==="
          ls -la temp_project/android/app/
          echo "=== Files in android/app/src/main/ ==="
          ls -la temp_project/android/app/src/main/

      - name: Copy Our Files
        run: |
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          mkdir -p temp_project/assets
          cp assets/app_icon.png temp_project/assets/app_icon.png
          rm -rf temp_project/test

      - name: Setup Android Files
        run: |
          cat > /tmp/setup.py << 'PYEOF'
          import re, sys, os, glob

          def edit_manifest(path):
              with open(path, 'r', encoding='utf-8') as f:
                  c = f.read()
              if 'RECEIVE_BOOT_COMPLETED' not in c:
                  p = '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application'
                  c = c.replace('<application', p, 1)
              if 'ScheduledNotificationReceiver' not in c:
                  r = '<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n            </intent-filter>\n        </receiver>\n    </application>'
                  c = c.replace('</application>', r, 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(c)
              print("Manifest OK")

          def edit_gradle(path):
              with open(path, 'r', encoding='utf-8') as f:
                  c = f.read()
              if path.endswith('.kts'):
                  # Kotlin DSL
                  if 'coreLibraryDesugaringEnabled' not in c:
                      c = c.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  if 'desugar_jdk_libs' not in c:
                      c = re.sub(r'dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")', c, count=1)
              else:
                  # Groovy DSL
                  if 'coreLibraryDesugaringEnabled' not in c:
                      c = c.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  if 'desugar_jdk_libs' not in c:
                      c = re.sub(r'dependencies\s*\{', "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'", c, count=1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(c)
              print(f"Gradle OK ({os.path.basename(path)})")

          d = sys.argv[1]
          manifest = os.path.join(d, 'android/app/src/main/AndroidManifest.xml')
          edit_manifest(manifest)

          # ابحث عن build.gradle أو build.gradle.kts
          gradle = os.path.join(d, 'android/app/build.gradle')
          gradle_kts = os.path.join(d, 'android/app/build.gradle.kts')

          if os.path.exists(gradle):
              edit_gradle(gradle)
          elif os.path.exists(gradle_kts):
              edit_gradle(gradle_kts)
          else:
              print("✗ No build.gradle or build.gradle.kts found")
              sys.exit(1)

          print("All done!")
          PYEOF
          python3 /tmp/setup.py temp_project

      - name: Rename App
        working-directory: temp_project
        run: |
          perl -i -pe 's|android:label="[^"]*"|android:label="Istaghfar"|' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        working-directory: temp_project
        run: flutter pub get

      - name: Generate App Icons
        working-directory: temp_project
        run: dart run flutter_launcher_icons

      - name: Build Debug APK
        working-directory: temp_project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istaghfar-debug
          path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
