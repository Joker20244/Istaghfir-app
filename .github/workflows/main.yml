name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create --org com.jkworks --project-name istaghfar temp_project

      - name: Copy Our Files
        run: |
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          mkdir -p temp_project/assets
          cp assets/app_icon.png temp_project/assets/app_icon.png
          rm -rf temp_project/test

      - name: Rename App
        working-directory: temp_project
        run: |
          perl -i -pe 's|android:label="[^"]*"|android:label="Istaghfar"|' android/app/src/main/AndroidManifest.xml

      - name: Add Notification Permissions
        working-directory: temp_project
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          perms = '''<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
    <uses-permission android:name=\"android.permission.VIBRATE\"/>
    <application'''
          if 'RECEIVE_BOOT_COMPLETED' not in content:
              content = content.replace('<application', perms, 1)
          receivers = '''<receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />
        <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\">
            <intent-filter>
                <action android:name=\"android.intent.action.BOOT_COMPLETED\"/>
                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\"/>
            </intent-filter>
        </receiver>
    </application>'''
          if 'ScheduledNotificationReceiver' not in content:
              content = content.replace('</application>', receivers, 1)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Enable Desugaring
        working-directory: temp_project
        run: |
          python3 -c "
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          if 'coreLibraryDesugaringEnabled' not in content:
              content = content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
          if 'desugar_jdk_libs' not in content:
              content = re.sub(r'dependencies \{', r'dependencies {\n    coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.0.4\'', content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          print('--- build.gradle after edit ---')
          print(content)
          "

      - name: Get Dependencies
        working-directory: temp_project
        run: flutter pub get

      - name: Generate App Icons
        working-directory: temp_project
        run: dart run flutter_launcher_icons

      - name: Build Debug APK
        working-directory: temp_project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istaghfar-debug
          path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
