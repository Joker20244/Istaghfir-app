name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. ننشئ مشروع Flutter جديد في مكان مؤقت
      - name: Create Flutter Project
        run: flutter create --project-name istaghfir_app temp_project

      # 2. ننقل ملفاتنا (main.dart و pubspec.yaml) للمشروع الجديد
      - name: Copy Our Files
        run: |
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          rm -rf temp_project/test

      # 3. ندخل المشروع وننفذ الأوامر
      - name: Get Dependencies
        working-directory: temp_project
        run: flutter pub get

      - name: Build Debug APK
        working-directory: temp_project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istaghfir-debug
          path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
