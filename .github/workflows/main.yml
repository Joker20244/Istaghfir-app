name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create --org com.jkworks --project-name istaghfar temp_project

      - name: Copy Our Files
        run: |
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          mkdir -p temp_project/assets
          cp assets/app_icon.png temp_project/assets/app_icon.png
          rm -rf temp_project/test

      - name: Setup Android Files
        run: |
          MANIFEST="temp_project/android/app/src/main/AndroidManifest.xml"
          GRADLE="temp_project/android/app/build.gradle.kts"

          # ---- 1) إضافة أذونات الإشعارات ----
          if ! grep -q "RECEIVE_BOOT_COMPLETED" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application|' "$MANIFEST"
          fi

          # ---- 2) إضافة receivers ----
          if ! grep -q "ScheduledNotificationReceiver" "$MANIFEST"; then
            sed -i 's|</application>|<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n            </intent-filter>\n        </receiver>\n    </application>|' "$MANIFEST"
          fi

          # ---- 3) تعديل build.gradle.kts ----
          # 3a) ndkVersion
          if ! grep -q 'ndkVersion' "$GRADLE"; then
            sed -i 's|namespace = "com.jkworks.istaghfar"|namespace = "com.jkworks.istaghfar"\n    ndkVersion = "27.0.12077973"|' "$GRADLE"
          fi

          # 3b) isCoreLibraryDesugaringEnabled
          if ! grep -q 'isCoreLibraryDesugaringEnabled' "$GRADLE"; then
            sed -i 's|compileOptions {|compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' "$GRADLE"
          fi

          # 3c) coreLibraryDesugaring dependency
          if ! grep -q 'coreLibraryDesugaring' "$GRADLE"; then
            echo '' >> "$GRADLE"
            echo 'dependencies {' >> "$GRADLE"
            echo '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' >> "$GRADLE"
            echo '}' >> "$GRADLE"
          fi

          echo "=== build.gradle.kts ==="
          cat "$GRADLE"
          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: Rename App
        working-directory: temp_project
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Istaghfar"|' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        working-directory: temp_project
        run: flutter pub get

      - name: Generate App Icons
        working-directory: temp_project
        run: dart run flutter_launcher_icons

      - name: Build Debug APK
        working-directory: temp_project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: istaghfar-debug
          path: temp_project/build/app/outputs/flutter-apk/app-debug.apk
